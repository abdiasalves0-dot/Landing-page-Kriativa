<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Assinatura Abdias Alves — Kriativa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    <style>
        @page {
            size: 580px 190px;
            margin: 0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 580px;
            height: 190px;
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signature-card {
            width: 580px;
            height: 190px;
            background: #fcfbfa;
            border: 1px solid #e0dbd1;
            border-radius: 12px;
            padding: 22px 28px;
            display: flex;
            align-items: center;
        }

        .sig-table {
            width: 100%;
            border-collapse: collapse;
        }

        .brand-col {
            vertical-align: middle;
            padding-right: 24px;
            border-right: 1.5px solid #ded9ce;
            width: 110px;
            text-align: center;
        }

        .brand-logo {
            width: 50px;
            height: 48px;
            display: block;
            margin: 0 auto 7px;
        }

        .brand-name {
            font-family: 'Inter', sans-serif;
            font-size: 8.5px;
            font-weight: 900;
            letter-spacing: 3px;
            color: #111111;
            text-transform: uppercase;
            line-height: 1;
        }

        .brand-sub {
            font-family: 'Inter', sans-serif;
            font-size: 6.5px;
            font-weight: 600;
            color: #777777;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 4px;
            line-height: 1;
        }

        .info-col {
            vertical-align: middle;
            padding-left: 24px;
        }

        .user-name {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 800;
            color: #111111;
            letter-spacing: -0.3px;
            line-height: 1.15;
        }

        .user-role {
            font-family: 'Inter', sans-serif;
            font-size: 10.5px;
            font-weight: 500;
            color: #555555;
            margin-top: 3px;
            margin-bottom: 9px;
        }

        .divider-line {
            height: 1px;
            width: 100%;
            background: #e2ded5;
            margin-bottom: 9px;
        }

        .contacts-table {
            border-collapse: collapse;
            font-family: 'Inter', sans-serif;
            font-size: 9.5px;
            line-height: 1.6;
        }

        .contact-label {
            color: #888888;
            font-weight: 500;
            padding-right: 8px;
        }

        .contact-value {
            color: #111111;
            font-weight: 700;
            text-decoration: none;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 8.5px;
            color: #777777;
            margin-top: 7px;
            line-height: 1.2;
        }
    </style>
</head>
