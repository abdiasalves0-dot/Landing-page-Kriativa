services:
  landing-page:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    labels:
      - "app=kriativa-landing-page"
      - "maintainer=kriativa"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL:-https://kriativasoftware.io}
    labels:
      - "app=kriativa-stripe-api"
      - "maintainer=kriativa"
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
