<!-- @dsCard height=288 -->
<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 288px; background: var(--bg); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; }
  svg { position: absolute; left: 0; top: 0; }
  .cream { fill: var(--white); }
  .graphite { fill: var(--graphite); }
  .graphite-mid { fill: var(--graphite-mid); }
  .graphite-light { fill: var(--graphite-light); }
  .cut { fill: var(--bg); }
  .text { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { margin: 0; font-family: var(--font-sans); font-weight: 900; font-size: 88px; line-height: 0.92; letter-spacing: -0.04em; color: var(--white); }
  .tagline { margin: 16px 0 0; font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 14px; color: var(--white-dim); }
</style></head>
<body>
<div class="cover">
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <!--
      blocks: white (cream) 360x168, graphite 112x168, graphite-light 232x112, graphite-mid 240x112; 8px gaps = space-8; all radius-none (the brand is square)
      arrangement: flush modular grid right of x=480, cream slab bleeding off the top-right edge, lower row bleeding off the bottom
      pattern: tiles cut by the radius tokens (geometric, modular) — the Identidade Visual service icon's square/disc checker, 40px units at a 48px pitch (space-40 + space-8), cut from the cream in bg
      scales: space-8, space-40, space-48 pitch; radius-none squares, discs at half the side; one pill at radius-pill (the primary button) in cream on graphite-mid
    -->
    <rect class="graphite" x="480" y="0" width="112" height="168"/>
    <rect class="cream" x="600" y="0" width="360" height="168"/>
    <rect class="graphite-light" x="480" y="176" width="232" height="112"/>
    <rect class="graphite-mid" x="720" y="176" width="240" height="112"/>

    <rect class="cut" x="640" y="40" width="40" height="40"/>
    <circle class="cut" cx="708" cy="60" r="20"/>
    <rect class="cut" x="736" y="40" width="40" height="40"/>
    <circle class="cut" cx="804" cy="60" r="20"/>
    <rect class="cut" x="832" y="40" width="40" height="40"/>
    <circle class="cut" cx="900" cy="60" r="20"/>
    <circle class="cut" cx="660" cy="108" r="20"/>
    <rect class="cut" x="688" y="88" width="40" height="40"/>
    <circle class="cut" cx="756" cy="108" r="20"/>
    <rect class="cut" x="784" y="88" width="40" height="40"/>
    <circle class="cut" cx="852" cy="108" r="20"/>
    <rect class="cut" x="880" y="88" width="40" height="40"/>

    <rect class="cream" x="760" y="208" width="160" height="48" rx="24"/>
  </svg>
  <div class="text">
    <p class="name">Kriativa</p>
    <p class="tagline">Do conceito visual ao sistema inteligente.</p>
  </div>
</div>
</body></html>
